<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Catch the Emoji</title>
<style>
  :root{
    --bg:#0f1724;
    --panel:#0b1220;
    --accent:#ffd166;
    --text:#e6eef8;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,"Noto Sans KR",sans-serif;background:linear-gradient(180deg,#071029 0%, #0f1724 100%);color:var(--text)}
  .wrap{max-width:900px;margin:24px auto;padding:16px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  h1{font-size:20px;margin:0}
  .panel{background:rgba(255,255,255,0.03);padding:12px;border-radius:12px;box-shadow:0 6px 18px rgba(2,6,23,0.6)}
  #game{
    position:relative;
    height:60vh;
    min-height:420px;
    overflow:hidden;
    border-radius:12px;
    margin-top:12px;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.02), transparent 10%),
      linear-gradient(180deg, rgba(255,255,255,0.02), transparent 40%),
      var(--panel);
  }
  .hud{display:flex;gap:12px;align-items:center}
  .stat{padding:8px 12px;background:rgba(255,255,255,0.02);border-radius:8px;font-weight:600}
  #score{color:var(--accent)}
  #lives{color:#ff6b6b}
  #timer{color:#9be7ff}
  .play-area{position:absolute;inset:0;pointer-events:none}
  .item{
    position:absolute;
    font-size:28px;
    pointer-events:auto;
    user-select:none;
    transform:translate(-50%, -50%);
    will-change:transform;
    text-shadow:0 2px 6px rgba(0,0,0,0.6);
  }
  .basket{
    position:absolute;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    width:110px;
    height:48px;
    border-radius:24px;
    background:linear-gradient(180deg,#ffd166,#f7a400);
    display:flex;align-items:center;justify-content:center;
    font-size:28px;
    box-shadow:0 8px 20px rgba(0,0,0,0.6);
    pointer-events:none;
  }
  .controls{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
  button{background:#0b1220;color:var(--text);border:1px solid rgba(255,255,255,0.04);padding:8px 12px;border-radius:8px;cursor:pointer}
  button.primary{background:var(--accent);color:#071029;font-weight:700}
  .overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg, rgba(2,6,23,0.6), rgba(2,6,23,0.6));
    color:var(--text);font-size:20px;z-index:40;backdrop-filter:blur(4px)
  }
  .small{font-size:13px;opacity:0.9}
  @media (max-width:520px){
    .basket{width:86px;height:44px;font-size:22px}
    .item{font-size:24px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Catch the Emoji</h1>
    <div class="hud">
      <div class="stat">점수 <span id="score">0</span></div>
      <div class="stat">목숨 <span id="lives">3</span></div>
      <div class="stat">시간 <span id="timer">00:00</span></div>
    </div>
  </header>

  <div id="game" class="panel" tabindex="0">
    <div class="play-area" id="play"></div>
    <div class="basket" id="basket">🧺</div>
    <div id="overlay" class="overlay" style="display:none"></div>
  </div>

  <div class="controls">
    <button id="startBtn" class="primary">게임 시작</button>
    <button id="pauseBtn">일시정지</button>
    <button id="restartBtn">재시작</button>
    <div class="small">조작: 마우스/터치 이동 또는 ← → 키</div>
  </div>
</div>

<script>
(() => {
  const play = document.getElementById('play');
  const basket = document.getElementById('basket');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const timerEl = document.getElementById('timer');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const restartBtn = document.getElementById('restartBtn');
  const gameEl = document.getElementById('game');

  let width, height;
  let basketX = 0;
  let score = 0;
  let lives = 3;
  let running = false;
  let lastTime = 0;
  let spawnTimer = 0;
  let spawnInterval = 1000; // ms
  let items = [];
  let elapsed = 0;
  let speedMultiplier = 1;
  const emojis = ['🍎','🍋','🍓','🍪','🍉','🍇','🍒','⭐','💎','💣'];

  function resize(){
    const rect = gameEl.getBoundingClientRect();
    width = rect.width;
    height = rect.height;
    // center basket
    if (!basketX) basketX = width/2;
    updateBasket();
  }

  function updateBasket(){
    basket.style.left = basketX + 'px';
  }

  function spawnItem(){
    const x = Math.random() * (width - 40) + 20;
    const emoji = emojis[Math.floor(Math.random()*emojis.length)];
    const el = document.createElement('div');
    el.className = 'item';
    el.textContent = emoji;
    el.style.left = x + 'px';
    el.style.top = '-30px';
    const speed = (80 + Math.random()*120) * speedMultiplier; // px per second
    play.appendChild(el);
    items.push({el,x,y:-30,speed,emoji});
  }

  function formatTime(ms){
    const s = Math.floor(ms/1000);
    const mm = String(Math.floor(s/60)).padStart(2,'0');
    const ss = String(s%60).padStart(2,'0');
    return mm + ':' + ss;
  }

  function gameOver(){
    running = false;
    overlay.style.display = 'flex';
    overlay.innerHTML = `<div style="text-align:center">
      <div style="font-size:28px;font-weight:700">게임 오버</div>
      <div class="small" style="margin-top:8px">최종 점수 <strong>${score}</strong></div>
      <div style="margin-top:12px"><button id="overlayRestart" class="primary">다시하기</button></div>
    </div>`;
    document.getElementById('overlayRestart').addEventListener('click', () => {
      overlay.style.display='none';
      restart();
    });
  }

  function update(dt){
    // spawn logic
    spawnTimer += dt;
    if (spawnTimer > spawnInterval){
      spawnTimer = 0;
      spawnItem();
      // gradually increase spawn rate
      spawnInterval = Math.max(300, spawnInterval - 8);
    }

    // update items
    for (let i = items.length-1; i >=0; i--){
      const it = items[i];
      it.y += it.speed * dt/1000;
      it.el.style.transform = `translate(-50%, -50%) translateY(${it.y}px)`;
      // check collision with basket
      const basketRect = basket.getBoundingClientRect();
      const itemRect = it.el.getBoundingClientRect();
      if (itemRect.top > basketRect.top - 8 && itemRect.left > basketRect.left - 20 && itemRect.right < basketRect.right + 20){
        // caught
        score += (it.emoji === '💣') ? -5 : 10;
        if (score < 0) score = 0;
        scoreEl.textContent = score;
        // small effect
        it.el.remove();
        items.splice(i,1);
        continue;
      }
      // missed
      if (it.y > height + 40){
        // if bomb missed, no penalty; if normal missed, lose life
        if (it.emoji !== '💣'){
          lives--;
          livesEl.textContent = lives;
          if (lives <= 0){
            gameOver();
            return;
          }
        }
        it.el.remove();
        items.splice(i,1);
      }
    }

    // difficulty scaling
    elapsed += dt;
    speedMultiplier = 1 + elapsed/20000; // slowly increase
    // update timer display
    timerEl.textContent = formatTime(elapsed);
  }

  function loop(ts){
    if (!lastTime) lastTime = ts;
    const dt = ts - lastTime;
    lastTime = ts;
    if (running){
      update(dt);
    }
    requestAnimationFrame(loop);
  }

  // Input handlers
  function onMove(clientX){
    const rect = gameEl.getBoundingClientRect();
    const x = clientX - rect.left;
    basketX = Math.max(40, Math.min(width-40, x));
    updateBasket();
  }

  gameEl.addEventListener('mousemove', e => {
    onMove(e.clientX);
  });
  gameEl.addEventListener('touchmove', e => {
    if (e.touches && e.touches[0]) onMove(e.touches[0].clientX);
  }, {passive:true});

  // keyboard
  let keyLeft=false, keyRight=false;
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') keyLeft = true;
    if (e.key === 'ArrowRight') keyRight = true;
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft') keyLeft = false;
    if (e.key === 'ArrowRight') keyRight = false;
  });

  function keyboardStep(dt){
    if (keyLeft) basketX -= 300 * dt/1000;
    if (keyRight) basketX += 300 * dt/1000;
    basketX = Math.max(40, Math.min(width-40, basketX));
    updateBasket();
  }

  // small loop for keyboard movement
  setInterval(() => {
    if (running) keyboardStep(16);
  }, 16);

  // Controls
  startBtn.addEventListener('click', () => {
    if (!running) start();
  });
  pauseBtn.addEventListener('click', () => {
    running = !running;
    pauseBtn.textContent = running ? '일시정지' : '계속';
    if (running) lastTime = performance.now();
  });
  restartBtn.addEventListener('click', restart);

  function start(){
    // reset if first time
    if (!running){
      running = true;
      overlay.style.display = 'none';
      lastTime = performance.now();
    }
  }

  function restart(){
    // clear items
    items.forEach(it => it.el.remove());
    items = [];
    score = 0;
    lives = 3;
    elapsed = 0;
    spawnInterval = 1000;
    spawnTimer = 0;
    speedMultiplier = 1;
    scoreEl.textContent = score;
    livesEl.textContent = lives;
    timerEl.textContent = '00:00';
    running = true;
    overlay.style.display = 'none';
    lastTime = performance.now();
  }

  // initial setup
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(loop);

  // small polish: spawn occasional bombs
  setInterval(() => {
    if (!running) return;
    if (Math.random() < 0.12) {
      // spawn a bomb item manually
      const x = Math.random() * (width - 40) + 20;
      const el = document.createElement('div');
      el.className = 'item';
      el.textContent = '💣';
      el.style.left = x + 'px';
      el.style.top = '-30px';
      const speed = (120 + Math.random()*160) * speedMultiplier;
      play.appendChild(el);
      items.push({el,x,y:-30,speed,emoji:'💣'});
    }
  }, 1500);

  // focus to capture keyboard on mobile when tapped
  gameEl.addEventListener('click', () => gameEl.focus());

  // friendly tip overlay at start
  overlay.style.display = 'flex';
  overlay.innerHTML = `<div style="text-align:center">
    <div style="font-size:22px;font-weight:700">Catch the Emoji</div>
    <div class="small" style="margin-top:8px">마우스나 터치로 바구니를 움직여 이모지를 받아보세요. 시간이 지날수록 빨라집니다.</div>
    <div style="margin-top:12px"><button id="overlayStart" class="primary">시작하기</button></div>
  </div>`;
  document.getElementById('overlayStart').addEventListener('click', () => {
    overlay.style.display='none';
    restart();
  });

})();
</script>
</body>
</html>
