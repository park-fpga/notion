<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>간단 회피 게임</title>
  <style>
    body { background:#222; color:#fff; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
    canvas { background:#111; display:block; border:4px solid #444; }
    #info { position:fixed; top:10px; left:10px; font-family:Arial; }
  </style>
</head>
<body>
  <div id="info">← → 이동 • 스페이스 재시작</div>
  <canvas id="game" width="480" height="640"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    let player = { x:220, y:560, w:40, h:20, speed:6 };
    let bullets = [];
    let enemies = [];
    let score = 0;
    let over = false;

    function spawnEnemy(){
      enemies.push({ x: Math.random()*(canvas.width-30), y:-30, w:30, h:30, speed: 2 + Math.random()*2 });
    }

    function reset(){
      player.x = 220; bullets=[]; enemies=[]; score=0; over=false;
      for(let i=0;i<3;i++) spawnEnemy();
    }

    function rectsColl(a,b){
      return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
    }

    function update(){
      if(over) return;
      // move enemies
      enemies.forEach(e=>{ e.y += e.speed; if(e.y>canvas.height) { e.y=-40; e.x=Math.random()*(canvas.width-e.w); score++; }});
      // move bullets
      bullets.forEach((b,i)=>{ b.y -= 8; if(b.y< -10) bullets.splice(i,1); });
      // collisions
      enemies.forEach((e,ei)=>{ if(rectsColl(e,player)) over=true; bullets.forEach((b,bi)=>{ if(rectsColl(b,e)){ enemies.splice(ei,1); bullets.splice(bi,1); score+=5; spawnEnemy(); } }); });
    }

    function draw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      // player
      ctx.fillStyle = '#4ee';
      ctx.fillRect(player.x, player.y, player.w, player.h);
      // enemies
      ctx.fillStyle = '#e44';
      enemies.forEach(e=> ctx.fillRect(e.x,e.y,e.w,e.h));
      // bullets
      ctx.fillStyle = '#ff0';
      bullets.forEach(b=> ctx.fillRect(b.x,b.y,b.w,b.h));
      // HUD
      ctx.fillStyle = '#fff'; ctx.font='18px Arial';
      ctx.fillText('점수: ' + score, 10, 24);
      if(over){ ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#fff'; ctx.font='36px Arial'; ctx.fillText('게임오버',120,320); ctx.font='18px Arial'; ctx.fillText('스페이스로 재시작',150,360); }
    }

    function loop(){
      update(); draw();
      requestAnimationFrame(loop);
    }

    // controls
    const keys = {};
    window.addEventListener('keydown', e=>{ keys[e.key]=true; if(e.key===' ' && over) reset(); if(e.key===' ' && !over){ bullets.push({ x: player.x+player.w/2-3, y: player.y-10, w:6, h:10 }); }});
    window.addEventListener('keyup', e=>{ keys[e.key]=false; });

    setInterval(()=>{
      if(keys['ArrowLeft']) player.x = Math.max(0, player.x - player.speed);
      if(keys['ArrowRight']) player.x = Math.min(canvas.width-player.w, player.x + player.speed);
    },16);

    // start
    reset();
    loop();
    setInterval(spawnEnemy, 2000);
  </script>
</body>
</html>
