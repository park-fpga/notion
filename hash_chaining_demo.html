<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hash Table — Chaining</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Pretendard:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f11;
    --surface: #1a1a1f;
    --surface2: #222228;
    --border: #2e2e38;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --accent: #7b61ff;
    --accent-dim: #2d2550;
    --green: #3ecf8e;
    --green-dim: #0e2e1f;
    --amber: #f5a623;
    --amber-dim: #2e1f00;
    --red: #f45b5b;
    --node-bg: #1e1e2e;
    --node-border: #3b3b55;
  }

  body {
    font-family: 'Pretendard', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1.5rem;
  }

  h1 {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }

  .subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 2rem;
  }

  .subtitle span {
    color: var(--accent);
  }

  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }

  input[type=number] {
    width: 90px;
    padding: 8px 12px;
    font-size: 15px;
    font-family: 'JetBrains Mono', monospace;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  input[type=number]:focus {
    border-color: var(--accent);
  }

  input[type=number]::placeholder { color: var(--muted); }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }

  button {
    padding: 8px 18px;
    font-size: 14px;
    font-family: 'Pretendard', sans-serif;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
  }

  button:hover { background: var(--surface2); border-color: var(--accent); }
  button:active { transform: scale(0.97); }

  button.primary {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: #c4b8ff;
  }
  button.primary:hover { background: #3a2e70; }

  button.ghost { background: transparent; border-color: var(--border); color: var(--muted); }
  button.ghost:hover { color: var(--text); border-color: var(--muted); }

  .msg-bar {
    height: 28px;
    margin-bottom: 1.5rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    transition: color 0.2s;
  }

  .msg-bar .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background 0.2s;
  }

  .msg-bar.ok { color: var(--green); }
  .msg-bar.ok .dot { background: var(--green); }
  .msg-bar.col { color: var(--amber); }
  .msg-bar.col .dot { background: var(--amber); }

  .table-wrap {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 0;
    min-height: 48px;
  }

  .row-idx {
    width: 32px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    padding-right: 10px;
    flex-shrink: 0;
  }

  .slot-box {
    width: 48px;
    height: 40px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: border-color 0.2s, background 0.2s;
  }

  .slot-box.has {
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  .slot-box .null {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--muted);
  }

  .pointer-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }

  .chain {
    display: flex;
    align-items: center;
    gap: 0;
    flex-wrap: nowrap;
    overflow-x: auto;
    padding-bottom: 2px;
  }

  .arrow-line {
    display: flex;
    align-items: center;
    width: 28px;
    flex-shrink: 0;
  }

  .arrow-line svg { width: 28px; height: 12px; }

  .node {
    height: 40px;
    padding: 0 14px;
    border: 1px solid var(--node-border);
    border-radius: 8px;
    background: var(--node-bg);
    display: flex;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    color: #a0a0c0;
    flex-shrink: 0;
    transition: all 0.3s;
  }

  .node.new-node {
    border-color: var(--green);
    background: var(--green-dim);
    color: var(--green);
    animation: pop 0.35s ease;
  }

  .node.collision-node {
    border-color: var(--amber);
    background: var(--amber-dim);
    color: var(--amber);
    animation: pop 0.35s ease;
  }

  @keyframes pop {
    0% { transform: scale(0.7); opacity: 0; }
    60% { transform: scale(1.08); }
    100% { transform: scale(1); opacity: 1; }
  }

  .stats {
    display: flex;
    gap: 12px;
    margin-top: 2rem;
    flex-wrap: wrap;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 18px;
  }

  .stat-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .stat-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 500;
    color: var(--text);
  }

  .stat-val.accent { color: var(--accent); }
  .stat-val.warn { color: var(--amber); }

  .formula {
    margin-top: 1.5rem;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .formula span { color: var(--accent); }
</style>
</head>
<body>

<h1>Data Structures</h1>
<div class="subtitle">Hash Table — <span>Chaining</span></div>

<div class="controls">
  <input type="number" id="key-input" placeholder="키 입력" min="0" max="9999" />
  <button class="primary" onclick="doInsert()">삽입</button>
  <button class="ghost" onclick="doReset()">초기화</button>
</div>

<div class="msg-bar" id="msg"><div class="dot"></div><span id="msg-text">키를 입력하고 삽입해봐</span></div>

<div class="table-wrap" id="table-view"></div>

<div class="stats">
  <div class="stat">
    <div class="stat-label">삽입된 키</div>
    <div class="stat-val accent" id="stat-n">0</div>
  </div>
  <div class="stat">
    <div class="stat-label">충돌 횟수</div>
    <div class="stat-val warn" id="stat-col">0</div>
  </div>
  <div class="stat">
    <div class="stat-label">Load factor α</div>
    <div class="stat-val" id="stat-lf">0.00</div>
  </div>
</div>

<div class="formula">
  h(k) = k <span>mod</span> 7 &nbsp;|&nbsp; 버킷 수 M = <span>7</span>
</div>

<script>
const M = 7;
const table = Array.from({length: M}, () => []);
let totalN = 0, totalCol = 0;
let lastKey = null, lastIdx = -1, wasCollision = false;

function hash(k) { return k % M; }

function render() {
  const tv = document.getElementById('table-view');
  tv.innerHTML = '';

  for (let i = 0; i < M; i++) {
    const row = document.createElement('div');
    row.className = 'row';

    const idx = document.createElement('div');
    idx.className = 'row-idx';
    idx.textContent = i;

    const slot = document.createElement('div');
    slot.className = 'slot-box' + (table[i].length > 0 ? ' has' : '');

    if (table[i].length === 0) {
      const n = document.createElement('span');
      n.className = 'null';
      n.textContent = '∅';
      slot.appendChild(n);
    } else {
      const pd = document.createElement('div');
      pd.className = 'pointer-dot';
      slot.appendChild(pd);
    }

    row.appendChild(idx);
    row.appendChild(slot);

    if (table[i].length > 0) {
      const chain = document.createElement('div');
      chain.className = 'chain';

      table[i].forEach((val, ni) => {
        const arrowWrap = document.createElement('div');
        arrowWrap.className = 'arrow-line';
        arrowWrap.innerHTML = `<svg viewBox="0 0 28 12" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="0" y1="6" x2="22" y2="6" stroke="#3b3b55" stroke-width="1.5"/>
          <polygon points="22,3 28,6 22,9" fill="#3b3b55"/>
        </svg>`;

        const node = document.createElement('div');
        const isNew = val === lastKey && i === lastIdx && ni === table[i].length - 1;
        node.className = 'node' + (isNew ? (wasCollision ? ' collision-node' : ' new-node') : '');
        node.textContent = val;

        chain.appendChild(arrowWrap);
        chain.appendChild(node);
      });

      row.appendChild(chain);
    }

    tv.appendChild(row);
  }

  document.getElementById('stat-n').textContent = totalN;
  document.getElementById('stat-col').textContent = totalCol;
  document.getElementById('stat-lf').textContent = (totalN / M).toFixed(2);
}

function doInsert() {
  const raw = document.getElementById('key-input').value;
  if (raw === '') return;
  const k = parseInt(raw);
  if (isNaN(k) || k < 0) return;

  const idx = hash(k);
  wasCollision = table[idx].length > 0;
  table[idx].push(k);
  lastKey = k;
  lastIdx = idx;
  totalN++;
  if (wasCollision) totalCol++;

  const msgBar = document.getElementById('msg');
  const msgText = document.getElementById('msg-text');

  if (wasCollision) {
    msgBar.className = 'msg-bar col';
    msgText.textContent = `충돌! h(${k}) = ${idx} — 이미 ${table[idx].length - 1}개 있음 → linked list에 추가`;
  } else {
    msgBar.className = 'msg-bar ok';
    msgText.textContent = `h(${k}) = ${idx} — 빈 슬롯, 바로 삽입`;
  }

  render();
  document.getElementById('key-input').value = '';
  document.getElementById('key-input').focus();
}

function doReset() {
  for (let i = 0; i < M; i++) table[i] = [];
  lastKey = null; lastIdx = -1; wasCollision = false;
  totalN = 0; totalCol = 0;
  const msgBar = document.getElementById('msg');
  msgBar.className = 'msg-bar';
  document.getElementById('msg-text').textContent = '키를 입력하고 삽입해봐';
  render();
}

document.getElementById('key-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doInsert();
});

render();
</script>
</body>
</html>
