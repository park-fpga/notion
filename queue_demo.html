<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Queue — Array 기반 구현</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #1a1a1a; padding: 24px; max-width: 700px; }
h2 { font-size: 18px; font-weight: 500; margin-bottom: 4px; }
.sub { font-size: 13px; color: #888; margin-bottom: 20px; }
.controls { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
input[type=number] {
  width: 70px; padding: 7px 10px; font-size: 14px;
  border: 1px solid #d0d0d0; border-radius: 8px;
  outline: none; color: #1a1a1a; background: #fff;
}
input[type=number]:focus { border-color: #378ADD; }
button {
  padding: 7px 14px; font-size: 14px;
  border: 1px solid #d0d0d0; border-radius: 8px;
  background: #fff; color: #1a1a1a; cursor: pointer;
}
button:hover { background: #f5f5f5; }
button.danger { border-color: #f09595; color: #a32d2d; }
button.danger:hover { background: #fcebeb; }
.stats { display: flex; gap: 20px; margin-bottom: 14px; font-size: 13px; color: #888; flex-wrap: wrap; }
.stat span { font-weight: 500; color: #1a1a1a; }
.pointer-row { display: flex; gap: 0; margin-bottom: 4px; }
.ptr { width: 56px; text-align: center; font-size: 11px; font-weight: 500; height: 16px; }
.ptr.f  { color: #27500a; }
.ptr.r  { color: #633806; }
.ptr.fr { color: #3c3489; }
.queue-wrap { display: flex; align-items: stretch; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; }
.cell {
  width: 56px; height: 52px; flex-shrink: 0;
  border: 1px solid #e0e0e0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: #fff;
}
.cell:first-child { border-radius: 8px 0 0 8px; }
.cell:last-child  { border-radius: 0 8px 8px 0; }
.cell.filled { background: #e6f1fb; border-color: #85b7eb; }
.cell.front  { background: #eaf3de; border-color: #97c459; }
.cell.rear   { background: #faeeda; border-color: #ef9f27; }
.cell.both   { background: #eeedfe; border-color: #afa9ec; }
.cell-idx { font-size: 11px; color: #aaa; }
.cell-val { font-size: 14px; font-weight: 500; color: #1a1a1a; }
.cell.filled .cell-val { color: #0c447c; }
.cell.front  .cell-val { color: #27500a; }
.cell.rear   .cell-val { color: #633806; }
.cell.both   .cell-val { color: #3c3489; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.leg { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #888; }
.legbox { width: 12px; height: 12px; border-radius: 3px; border: 1px solid; flex-shrink: 0; }
.log-wrap { margin-top: 16px; }
.log-title { font-size: 12px; color: #888; margin-bottom: 6px; }
.log-list { display: flex; flex-direction: column; gap: 4px; }
.log-item { font-size: 13px; padding: 6px 10px; border-radius: 6px; line-height: 1.5; }
.log-item.ok   { background: #eaf3de; color: #27500a; }
.log-item.err  { background: #fcebeb; color: #a32d2d; }
.log-item.info { background: #faeeda; color: #633806; }
</style>
</head>
<body>

<h2>Queue — Array 기반 구현</h2>
<p class="sub">circular array | N = 8 | r 위치는 항상 비어있어</p>

<div class="controls">
  <input type="number" id="val-in" placeholder="값" min="0" max="99"/>
  <button onclick="doEnqueue()">enqueue</button>
  <button onclick="doDequeue()">dequeue</button>
  <button onclick="doFirst()">first</button>
  <button class="danger" onclick="doReset()">초기화</button>
</div>

<div class="stats">
  <div>size: <span id="st-size">0</span></div>
  <div>front (f): <span id="st-f">0</span></div>
  <div>rear (r): <span id="st-r">0</span></div>
  <div>is_empty: <span id="st-empty">True</span></div>
</div>

<div class="pointer-row" id="ptr-row"></div>
<div class="queue-wrap" id="queue-wrap"></div>

<div class="legend">
  <div class="leg"><div class="legbox" style="background:#eaf3de;border-color:#97c459;"></div>f (front)</div>
  <div class="leg"><div class="legbox" style="background:#faeeda;border-color:#ef9f27;"></div>r (rear, 빈 칸)</div>
  <div class="leg"><div class="legbox" style="background:#eeedfe;border-color:#afa9ec;"></div>f = r (비어있음)</div>
  <div class="leg"><div class="legbox" style="background:#e6f1fb;border-color:#85b7eb;"></div>데이터</div>
</div>

<div class="log-wrap">
  <div class="log-title">연산 로그</div>
  <div class="log-list" id="log-list"></div>
</div>

<script>
(function(){
  var N = 8;
  var data = new Array(N).fill(null);
  var f = 0, r = 0;

  function size(){ return (N - f + r) % N; }
  function isEmpty(){ return f === r; }

  function render(){
    document.getElementById('st-size').textContent = size();
    document.getElementById('st-f').textContent = f;
    document.getElementById('st-r').textContent = r;
    document.getElementById('st-empty').textContent = isEmpty() ? 'True' : 'False';

    var qw = document.getElementById('queue-wrap');
    var pr = document.getElementById('ptr-row');
    qw.innerHTML = ''; pr.innerHTML = '';

    for(var i = 0; i < N; i++){
      var isF = (i === f), isR = (i === r);
      var cell = document.createElement('div');
      var cls = 'cell';
      if(isF && isR) cls += ' both';
      else if(isF && data[i] !== null) cls += ' front';
      else if(isR) cls += ' rear';
      else if(data[i] !== null) cls += ' filled';
      cell.className = cls;

      var idxEl = document.createElement('div');
      idxEl.className = 'cell-idx';
      idxEl.textContent = i;
      var valEl = document.createElement('div');
      valEl.className = 'cell-val';
      valEl.textContent = data[i] !== null ? data[i] : '';
      cell.appendChild(idxEl);
      cell.appendChild(valEl);
      qw.appendChild(cell);

      var pEl = document.createElement('div');
      pEl.className = 'ptr' + (isF && isR ? ' fr' : isF ? ' f' : isR ? ' r' : '');
      pEl.textContent = isF && isR ? 'f=r' : isF ? 'f' : isR ? 'r' : '';
      pr.appendChild(pEl);
    }
  }

  function addLog(text, type){
    var list = document.getElementById('log-list');
    var item = document.createElement('div');
    item.className = 'log-item ' + type;
    item.textContent = text;
    list.insertBefore(item, list.firstChild);
    if(list.children.length > 8) list.removeChild(list.lastChild);
  }

  window.doEnqueue = function(){
    var raw = document.getElementById('val-in').value;
    if(raw === '') return;
    var val = parseInt(raw);
    if(size() === N - 1){
      addLog('enqueue(' + val + ') → FullQueueException! (size = N-1 = ' + (N-1) + ')', 'err');
      return;
    }
    var avail = (f + size()) % N;
    data[r] = val;
    r = (r + 1) % N;
    addLog('enqueue(' + val + ') → avail = (' + f + ' + ' + (size()-1) + ') % ' + N + ' = ' + avail + ', r = ' + r, 'ok');
    document.getElementById('val-in').value = '';
    render();
  };

  window.doDequeue = function(){
    if(isEmpty()){
      addLog('dequeue() → EmptyQueueException!', 'err');
      return;
    }
    var val = data[f];
    var oldF = f;
    data[f] = null;
    f = (f + 1) % N;
    addLog('dequeue() → ' + val + ' 반환. f: ' + oldF + ' → ' + f, 'info');
    render();
  };

  window.doFirst = function(){
    if(isEmpty()){
      addLog('first() → EmptyQueueException!', 'err');
      return;
    }
    addLog('first() → ' + data[f] + ' (제거 안 함, f = ' + f + ')', 'ok');
  };

  window.doReset = function(){
    data = new Array(N).fill(null);
    f = 0; r = 0;
    document.getElementById('log-list').innerHTML = '';
    render();
  };

  document.getElementById('val-in').addEventListener('keydown', function(e){
    if(e.key === 'Enter') doEnqueue();
  });

  render();
})();
</script>
</body>
</html>
